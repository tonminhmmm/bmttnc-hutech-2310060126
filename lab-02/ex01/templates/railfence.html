<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rail Fence Cipher Demo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">Rail Fence Cipher</h1>

    <div class="row">
      <!-- Encrypt Card -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Encrypt</div>
          <div class="card-body">
            <form method="post" action="/railfence/encrypt">
              <div class="form-group">
                <label for="encryptText">Plain Text</label>
                <textarea
                  id="encryptText"
                  name="text"
                  class="form-control"
                  rows="3"
                  placeholder="Enter text to encrypt"
                  required
                >{{ request.form.text if mode=='Encrypted' else '' }}</textarea>
              </div>
              <div class="form-group">
                <label for="encryptKey">Rails</label>
                <input
                  type="number"
                  id="encryptKey"
                  name="key"
                  class="form-control"
                  min="2"
                  placeholder="Number of rails"
                  value="{{ request.form.key if mode=='Encrypted' else '' }}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Encrypt
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Decrypt Card -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">Decrypt</div>
          <div class="card-body">
            <form method="post" action="/railfence/decrypt">
              <div class="form-group">
                <label for="decryptText">Cipher Text</label>
                <textarea
                  id="decryptText"
                  name="text"
                  class="form-control"
                  rows="3"
                  placeholder="Enter text to decrypt"
                  required
                >{{ request.form.text if mode=='Decrypted' else '' }}</textarea>
              </div>
              <div class="form-group">
                <label for="decryptKey">Rails</label>
                <input
                  type="number"
                  id="decryptKey"
                  name="key"
                  class="form-control"
                  min="2"
                  placeholder="Number of rails"
                  value="{{ request.form.key if mode=='Decrypted' else '' }}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-success btn-block">
                Decrypt
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    {% if result %}
      <div class="alert alert-info text-center">
        <h5 class="mb-1">{{ mode }} Text</h5>
        <pre class="mb-0">{{ result }}</pre>
      </div>
    {% endif %}

    <p class="text-center mt-4">
      <a href="/" class="btn btn-link">← Back to Home</a>
    </p>
  </div>
</body>
</html>
