<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vigenere Cipher Demo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">Vigenere Cipher</h1>

    <div class="row">
      <!-- Encrypt Form -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            Encrypt
          </div>
          <div class="card-body">
            <form method="post" action="/vigenere/encrypt">
              <div class="form-group">
                <label for="encryptText">Plain Text</label>
                <textarea
                  id="encryptText"
                  name="text"
                  class="form-control"
                  rows="3"
                  placeholder="Enter text to encrypt"
                  required
                >{{ request.form.text if mode=='Encrypted' else '' }}</textarea>
              </div>
              <div class="form-group">
                <label for="encryptKey">Key</label>
                <input
                  type="text"
                  id="encryptKey"
                  name="key"
                  class="form-control"
                  placeholder="Enter key (letters only)"
                  value="{{ request.form.key if mode=='Encrypted' else '' }}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Encrypt
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Decrypt Form -->
      <div class="col-md-6 mb-4">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white">
            Decrypt
          </div>
          <div class="card-body">
            <form method="post" action="/vigenere/decrypt">
              <div class="form-group">
                <label for="decryptText">Cipher Text</label>
                <textarea
                  id="decryptText"
                  name="text"
                  class="form-control"
                  rows="3"
                  placeholder="Enter text to decrypt"
                  required
                >{{ request.form.text if mode=='Decrypted' else '' }}</textarea>
              </div>
              <div class="form-group">
                <label for="decryptKey">Key</label>
                <input
                  type="text"
                  id="decryptKey"
                  name="key"
                  class="form-control"
                  placeholder="Enter key (letters only)"
                  value="{{ request.form.key if mode=='Decrypted' else '' }}"
                  required
                />
              </div>
              <button type="submit" class="btn btn-success btn-block">
                Decrypt
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Result -->
    {% if result %}
      <div class="alert alert-info text-center">
        <h5 class="mb-1">{{ mode }} Text</h5>
        <pre class="mb-0">{{ result }}</pre>
      </div>
    {% endif %}

    <p class="text-center mt-4">
      <a href="/" class="btn btn-link">← Back to Home</a>
    </p>
  </div>
</body>
</html>
