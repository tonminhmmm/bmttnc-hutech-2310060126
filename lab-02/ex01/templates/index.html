<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thực hành An toàn thông tin nâng cao</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Font Awesome để có icon -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #ffffff; /* nền trắng */
      min-height: 100vh;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    .header {
      position: relative;
      margin-bottom: 3rem;
    }
    .header img {
      max-width: 100px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .header .title {
      margin-left: 120px; /* đẩy tiêu đề ra khỏi logo */
      color: #343a40;
      font-weight: bold;
    }
    .card-deck .card {
      border-radius: 1rem;
      transition: transform .2s, box-shadow .2s;
    }
    .card-deck .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .card-icon {
      font-size: 3rem;
      color: #4e73df;
      margin-bottom: .5rem;
    }
    .card-title {
      font-size: 1.25rem;
      margin-bottom: .75rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header với logo bên trái -->
    <div class="header text-left">
      <img
        src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png"
        alt="HUTECH logo"
      />
      <h2 class="title">BÀI THỰC HÀNH BẢO MẬT THÔNG TIN NÂNG CAO</h2>
    </div>

    <!-- Card deck các lựa chọn -->
    <div class="card-deck">

      <a href="/caesar" class="card text-center bg-light">
        <div class="card-body">
          <i class="fas fa-key card-icon"></i>
          <h5 class="card-title">Caesar Cipher</h5>
          <p class="card-text text-muted">Dịch chuyển ký tự</p>
        </div>
      </a>

      <a href="/vigenere" class="card text-center bg-light">
        <div class="card-body">
          <i class="fas fa-lock card-icon"></i>
          <h5 class="card-title">Vigenere Cipher</h5>
          <p class="card-text text-muted">Khóa nhiều ký tự</p>
        </div>
      </a>

      <a href="/railfence" class="card text-center bg-light">
        <div class="card-body">
          <i class="fas fa-ruler-vertical card-icon"></i>
          <h5 class="card-title">Rail Fence Cipher</h5>
          <p class="card-text text-muted">Lát rào ký tự</p>
        </div>
      </a>

      <a href="/playfair" class="card text-center bg-light">
        <div class="card-body">
          <i class="fas fa-chess-rook card-icon"></i>
          <h5 class="card-title">Playfair Cipher</h5>
          <p class="card-text text-muted">Ma trận 5×5</p>
        </div>
      </a>

      <a href="/transposition" class="card text-center bg-light">
        <div class="card-body">
          <i class="fas fa-th card-icon"></i>
          <h5 class="card-title">Transposition Cipher</h5>
          <p class="card-text text-muted">Hoán vị cột</p>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
